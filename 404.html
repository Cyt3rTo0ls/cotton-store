<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Cotton Store</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .notfound {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #0a0a0a;
      color: #fff;
      text-align: center;
      padding: 32px 18px;
    }
    .notfound-inner { max-width: 640px; }
    .notfound img { width: 96px; height: 96px; margin: 0 auto 28px; object-fit: contain; }
    .notfound-code {
      font-family: var(--display);
      font-size: clamp(4.5rem, 18vw, 10rem);
      font-weight: 900;
      line-height: .8;
      letter-spacing: -.06em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255,255,255,.5);
    }
    .notfound h1 {
      margin: 18px 0 12px;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      text-transform: uppercase;
    }
    .notfound p { color: #a9a399; font-size: 14px; max-width: 40ch; margin: 0 auto 28px; }
    .notfound-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .notfound-actions .btn-solid:hover { background: transparent; color: #fff; }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-inner">
      <img src="/assets/img/mark.webp" alt="Cotton Store">
      <p class="notfound-code">404</p>
      <h1>Esta pieza no está en el catálogo.</h1>
      <p>La página que buscas no existe o cambió de lugar. Vuelve al catálogo o escríbenos y te ayudamos a encontrar lo que buscas.</p>
      <div class="notfound-actions">
        <a class="btn btn-solid" href="/">Volver al catálogo</a>
        <a class="btn btn-outline-light" href="https://wa.me/584120522641?text=Hola%20Cotton%20Store%20%F0%9F%91%8B%20Llegu%C3%A9%20a%20una%20p%C3%A1gina%20que%20no%20existe." target="_blank" rel="noopener">Escribir por WhatsApp</a>
      </div>
    </div>
  </main>
</body>
</html>
